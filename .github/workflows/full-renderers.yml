name: Full renderer validation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-renderers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Full quality + P + K + R + Hybrid
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements*.txt
            tools/constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/toolkit/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python and Chromium toolkit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements-dev.txt
          python -m pip check
          npm ci --prefix tools/toolkit

      - name: Prepare validation logs
        run: mkdir -p "$RUNNER_TEMP/video-motion-ci"

      - name: Run the complete quality suite once
        run: |
          set -o pipefail
          bash tools/ci.sh 2>&1 | tee "$RUNNER_TEMP/video-motion-ci/quality.log"

      - name: Run real renders for P, K, R, and Hybrid
        env:
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: |
          set -o pipefail
          python tools/selftest.py --remotion --hybrid --skip-tests 2>&1 | tee "$RUNNER_TEMP/video-motion-ci/all-renderers.log"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-renderers-validation-log
          path: ${{ runner.temp }}/video-motion-ci/
          if-no-files-found: ignore
          retention-days: 14
