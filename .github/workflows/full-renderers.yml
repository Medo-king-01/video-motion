name: Full validation (nightly/manual)

# Nightly/manual only: pull requests already run the whole suite as the three
# parallel groups in ci.yml. This job adds the real P/K/R/Hybrid renders.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-renderers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-quality:
    name: Full quality suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            tools/requirements*.txt
            tools/constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/toolkit/package-lock.json
            medo-motion/templates/remotion/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install quality and Chromium toolkit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements-dev.txt
          python -m pip check
          npm ci --prefix tools/toolkit

      - name: Run the complete quality suite
        run: |
          set -o pipefail
          bash tools/ci.sh 2>&1 | tee "$RUNNER_TEMP/quality-python-${{ matrix.python-version }}.log"

      - name: Upload quality log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: quality-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/quality-python-${{ matrix.python-version }}.log
          if-no-files-found: ignore
          retention-days: 14

  full-renderers:
    name: Full P + K + R + Hybrid render smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements*.txt
            tools/constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/toolkit/package-lock.json
            medo-motion/templates/remotion/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python and Chromium toolkit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements-dev.txt
          python -m pip check
          npm ci --prefix tools/toolkit

      - name: Prepare validation logs
        run: mkdir -p "$RUNNER_TEMP/video-motion-ci"

      - name: Run real renders for P, K, R, and Hybrid
        env:
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: |
          set -o pipefail
          python tools/selftest.py --remotion --hybrid --skip-tests 2>&1 | tee "$RUNNER_TEMP/video-motion-ci/all-renderers.log"

      - name: Upload renderer validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: full-renderers-validation-log
          path: ${{ runner.temp }}/video-motion-ci/
          if-no-files-found: ignore
          retention-days: 14
