name: Full renderer validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-renderers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-all-renderers:
    name: P + K + R + Hybrid
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/toolkit/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python and Chromium toolkit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt pytest ruff
          npm ci --prefix tools/toolkit

      - name: Run static checks, unit tests, lint fixtures, and brand audits
        run: bash tools/ci.sh

      - name: Run real renders for P, K, R, and Hybrid
        env:
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/video-motion-ci"
          set -o pipefail
          python tools/selftest.py --remotion --hybrid 2>&1 | tee "$RUNNER_TEMP/video-motion-ci/all-renderers.log"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-renderers-validation-log
          path: ${{ runner.temp }}/video-motion-ci/all-renderers.log
          if-no-files-found: ignore
          retention-days: 14
