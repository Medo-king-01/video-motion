name: Remotion scene effects smoke

on:
  push:
    branches:
      - "feat/deterministic-motion-effects"
    paths:
      - "medo-motion/templates/remotion/**"
      - "tools/selftest.py"
      - "tools/new_project.py"
      - "tools/chromium.mjs"
      - ".github/workflows/remotion-effects-smoke.yml"
  pull_request:
    paths:
      - "medo-motion/templates/remotion/**"
      - "tools/selftest.py"
      - "tools/new_project.py"
      - "tools/chromium.mjs"
      - ".github/workflows/remotion-effects-smoke.yml"

permissions:
  contents: read

concurrency:
  group: remotion-effects-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-smoke:
    name: P + K + Remotion scene effects smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements*.txt
            tools/constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/toolkit/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python and shared Chromium toolkit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements-dev.txt
          python -m pip check
          npm ci --prefix tools/toolkit

      - name: Render P, K, and Remotion scene effects
        env:
          PYTHONUNBUFFERED: "1"
          CI: "true"
        run: |
          set -o pipefail
          python tools/selftest.py --remotion --skip-tests 2>&1 | tee "$RUNNER_TEMP/remotion-effects-smoke.log"

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-scene-effects-smoke-log
          path: ${{ runner.temp }}/remotion-effects-smoke.log
          if-no-files-found: ignore
          retention-days: 14
