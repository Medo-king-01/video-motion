name: RAM Episode 03 — S01 preview

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/ram-episode-03/**"
      - ".github/workflows/ram-episode-03-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ram-episode-03-preview-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  render-s01:
    name: Render S01 contact sheet
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/toolkit/package-lock.json

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip pillow
          npm ci --prefix tools/toolkit

      - name: Resolve bundled Chromium
        run: |
          export MEDO_TOOLKIT="$GITHUB_WORKSPACE/tools/toolkit"
          eval "$(node tools/chromium.mjs --env)"
          echo "MEDO_TOOLKIT=$MEDO_TOOLKIT" >> "$GITHUB_ENV"
          echo "MEDO_CHROMIUM=$MEDO_CHROMIUM" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          node tools/chromium.mjs --check

      - name: Render S01 frames
        working-directory: projects/ram-episode-03
        run: |
          node src/render.js --from 0 --to 12.358 --fps 30 --scale 0.5 --out cache/s01 --jpg

      - name: Build contact sheet
        working-directory: projects/ram-episode-03
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math

          frames_dir = Path("cache/s01")
          frames = sorted(frames_dir.glob("*.jpg"))
          if len(frames) < 300:
              raise SystemExit(f"Expected at least 300 rendered frames, got {len(frames)}")

          # Sample one frame per second across the 12.358-second prototype.
          indexes = [min(round(t * 30), len(frames) - 1) for t in range(12)]
          thumbs = []
          for second, index in enumerate(indexes):
              image = Image.open(frames[index]).convert("RGB")
              image.thumbnail((270, 480))
              tile = Image.new("RGB", (270, 510), "#111111")
              tile.paste(image, ((270-image.width)//2, 22))
              ImageDraw.Draw(tile).text((10, 5), f"{second:02d}s", fill="#ffffff")
              thumbs.append(tile)

          sheet = Image.new("RGB", (1080, 1530), "#080808")
          for i, tile in enumerate(thumbs):
              sheet.paste(tile, ((i % 4) * 270, (i // 4) * 510))
          out = Path("artifacts")
          out.mkdir(exist_ok=True)
          sheet.save(out / "s01-contact-sheet.jpg", quality=92)
          print(f"Contact sheet created from {len(frames)} rendered frames")
          PY

      - name: Upload S01 preview
        uses: actions/upload-artifact@v4
        with:
          name: ram-episode-03-s01-preview
          path: projects/ram-episode-03/artifacts/s01-contact-sheet.jpg
          if-no-files-found: error
          retention-days: 14
