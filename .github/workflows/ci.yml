name: CI

# Every pull request runs the whole suite — split into three disjoint groups that
# run as parallel jobs (tools/ci_groups.py --check proves nothing falls between
# them), plus the static contracts. The old workflow ran 12 of 78 test files on a
# PR, so a renderer regression could merge unnoticed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  static:
    name: Static contracts (Python 3.12)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements*.txt
            tools/constraints.txt
      - name: Install pinned tooling
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Python syntax
        run: python -m compileall -q tools medo-motion tests
      - name: Ruff
        run: python -m ruff check .
      - name: Documented numbers match the libraries
        run: python tools/sync_docs_numbers.py --check
      - name: Every test file belongs to exactly one CI group
        run: python tools/ci_groups.py --check
      - name: Shared JS matches both engines (K/R)
        run: python tools/sync_shared_libs.py --check
      - name: Technique library and generated docs
        run: |
          python tools/techniques.py --validate
          python tools/techniques.py --markdown docs/techniques.md --check
      - name: Font lock, icons and contrast contracts
        run: |
          python tools/fonts_install.py --verify-lock
          python medo-motion/icons/build.py --check
          python tools/contrast.py --check
      - name: Brand audit
        run: python medo-motion/scripts/brand_check.py --project medo-motion/templates

  python-310-syntax:
    name: Python 3.10 syntax compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      - name: Verify Python 3.10 syntax compatibility
        run: python -m compileall -q tools medo-motion tests

  contracts:
    name: Contracts group (docs, schemas, brand, lint)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements*.txt
            tools/constraints.txt
      - name: Install pinned dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Run the contracts group
        run: python -m pytest -q -n 2 --dist loadgroup $(python tools/ci_groups.py contracts)

  unit:
    name: Unit group (Arabic, audio, motion maths, icons)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements*.txt
            tools/constraints.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install pinned dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Run the unit group
        run: python -m pytest -q -n 2 --dist loadgroup $(python tools/ci_groups.py unit)

  coverage:
    name: Coverage report (floor 30%)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements*.txt
            tools/constraints.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install pinned dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Install the K toolkit
        run: npm ci --prefix tools/toolkit
      - name: Full suite with coverage
        # Floor, not a target: it starts at 30% (measured fast-loop total is 33%) and rises
        # with the suite, so coverage can only move up without a deliberate decision here.
        # `--dist loadgroup`: this is the full suite, so it includes the Remotion bundling tests
        # whose `xdist_group` marks are inert without it (tools/ci_groups.py --check enforces it).
        run: python -m pytest -q -n 2 --dist loadgroup --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=30
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  render-smoke:
    name: Render group (Chromium, FFmpeg, media QA)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements*.txt
            tools/constraints.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/toolkit/package-lock.json
            medo-motion/templates/remotion/package-lock.json
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install pinned dependencies and the Chromium toolkit
        run: |
          python -m pip install -r tools/requirements-dev.txt
          npm ci --prefix tools/toolkit
      - name: Run the render group
        # `loadgroup` is what makes the `xdist_group` marks real: the Remotion bundling tests
        # must share one worker, or two webpack bundles race and one render gets a 404.
        run: python -m pytest -q -n 2 --dist loadgroup $(python tools/ci_groups.py render)
      - name: Render and verify a 3-frame Engine P smoke test
        env:
          REEL_DIR: ${{ github.workspace }}
          REEL_MAXFRAMES: "3"
          REEL_CHUNK: "3"
        run: |
          python medo-motion/templates/procedural-reels/run_all.py
          test -s out/video_only.mp4
      - name: Upload render smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: render-smoke
          path: |
            out/video_only.mp4
            out_log.txt
          if-no-files-found: ignore
          retention-days: 7
