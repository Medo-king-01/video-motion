name: Fast CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-static-checks:
    name: Fast static checks (Python 3.12)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linter
        run: python -m pip install ruff

      - name: Check Python syntax
        run: python -m compileall -q tools medo-motion tests

      - name: Run Ruff
        run: python -m ruff check .

  python-310-syntax:
    name: Python 3.10 syntax compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Python 3.10 syntax compatibility
        run: python -m compileall -q tools medo-motion tests
