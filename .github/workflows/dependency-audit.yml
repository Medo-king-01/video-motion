name: Dependency audit

# Audits are network-backed observations, separate from reproducible render tests.
# No automatic upgrades or paid/private-repository security actions are used.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit reviewed Python dependencies
        run: pip-audit --vulnerability-service pypi -r tools/requirements-dev.txt
  node:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit toolkit and Remotion template independently
        shell: bash
        run: |
          status=0
          for directory in tools/toolkit medo-motion/templates/remotion; do
            npm audit --prefix "$directory" --package-lock-only --omit=dev --audit-level=high || status=1
          done
          exit "$status"
