<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Sliders Horizontal Icon" data-icon="sliders-horizontal-icon">
  <title>Sliders Horizontal Icon</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.85s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 0.83s infinite ease-in-out}
  .f{fill:currentColor;stroke:none;animation:fadeIn .45s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <polyline class="a" pathLength="1" points="3,5 10,5" style="animation-delay:0.0s"/>
  <polyline class="a" pathLength="1" points="14,3 14,7" style="animation-delay:0.06s"/>
  <polyline class="a" pathLength="1" points="14,5 21,5" style="animation-delay:0.12s"/>
  <polyline class="a" pathLength="1" points="3,12 8,12" style="animation-delay:0.18s"/>
  <polyline class="a" pathLength="1" points="8,10 8,14" style="animation-delay:0.24s"/>
  <polyline class="a" pathLength="1" points="12,12 21,12" style="animation-delay:0.3s"/>
  <polyline class="a" pathLength="1" points="3,19 12,19" style="animation-delay:0.36s"/>
  <polyline class="a" pathLength="1" points="16,17 16,21" style="animation-delay:0.42s"/>
  <polyline class="a" pathLength="1" points="16,19 21,19" style="animation-delay:0.48s"/>
</svg>
