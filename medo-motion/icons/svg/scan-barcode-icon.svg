<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Scan Barcode Icon" data-icon="scan-barcode-icon">
  <title>Scan Barcode Icon</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.85s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 0.83s infinite ease-in-out}
  .f{fill:currentColor;stroke:none;animation:fadeIn .45s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <path class="a" pathLength="1" d="M3 7V5a2 2 0 0 1 2-2h2" style="animation-delay:0.0s"/>
  <path class="a" pathLength="1" d="M17 3h2a2 2 0 0 1 2 2v2" style="animation-delay:0.06s"/>
  <path class="a" pathLength="1" d="M21 17v2a2 2 0 0 1-2 2h-2" style="animation-delay:0.12s"/>
  <path class="a" pathLength="1" d="M7 21H5a2 2 0 0 1-2-2v-2" style="animation-delay:0.18s"/>
  <path class="a" pathLength="1" d="M8 7v10" style="animation-delay:0.24s"/>
  <path class="a" pathLength="1" d="M12 7v10" style="animation-delay:0.3s"/>
  <path class="a" pathLength="1" d="M17 7v10" style="animation-delay:0.36s"/>
  <polyline class="a" pathLength="1" points="8,12 17,12" style="animation-delay:0.42s"/>
</svg>
