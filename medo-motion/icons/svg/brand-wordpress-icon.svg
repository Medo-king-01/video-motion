<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Brand Wordpress Icon" data-icon="brand-wordpress-icon">
  <title>Brand Wordpress Icon</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.85s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 0.83s infinite ease-in-out}
  .f{fill:currentColor;stroke:none;animation:fadeIn .45s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <path class="a" pathLength="1" d="M9.5 9h3" style="animation-delay:0.0s"/>
  <path class="a" pathLength="1" d="M4 9h2.5" style="animation-delay:0.06s"/>
  <path class="a" pathLength="1" d="M11 9l3 11l4 -9" style="animation-delay:0.12s"/>
  <path class="a" pathLength="1" d="M5.5 9l3.5 11l3 -7" style="animation-delay:0.18s"/>
  <path class="a" pathLength="1" d="M18 11c.177 -.528 1 -1.364 1 -2.5c0 -1.78 -.776 -2.5 -1.875 -2.5c-.898 0 -1.125 .812 -1.125 1.429c0 1.83 2 2.058 2 3.571" style="animation-delay:0.24s"/>
  <path class="a" pathLength="1" d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" style="animation-delay:0.3s"/>
</svg>
