<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Bug Icon" data-icon="bug-icon">
  <title>Bug Icon</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.85s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 0.83s infinite ease-in-out}
  .f{fill:currentColor;stroke:none;animation:fadeIn .45s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <path class="a" pathLength="1" d="M9 9v-1a3 3 0 0 1 6 0v1" style="animation-delay:0.0s"/>
  <path class="a" pathLength="1" d="M8 9h8a6 6 0 0 1 1 3v3a5 5 0 0 1 -10 0v-3a6 6 0 0 1 1 -3" style="animation-delay:0.06s"/>
  <path class="a" pathLength="1" d="M3 13l4 0" style="animation-delay:0.12s"/>
  <path class="a" pathLength="1" d="M4 19l3.35 -2" style="animation-delay:0.18s"/>
  <path class="a" pathLength="1" d="M4 7l3.75 2.4" style="animation-delay:0.24s"/>
  <path class="a" pathLength="1" d="M17 13l4 0" style="animation-delay:0.3s"/>
  <path class="a" pathLength="1" d="M20 19l-3.35 -2" style="animation-delay:0.36s"/>
  <path class="a" pathLength="1" d="M20 7l-3.75 2.4" style="animation-delay:0.42s"/>
  <path class="a" pathLength="1" d="M12 20l0 -6" style="animation-delay:0.48s"/>
</svg>
