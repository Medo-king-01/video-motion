<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Battery — البطارية" data-icon="battery">
  <title>Battery — البطارية</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.8s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 1.11s infinite ease-in-out}
  .f{fill:var(--icon-accent,currentColor);stroke:none;animation:fadeIn .5s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <polygon class="a" pathLength="1" points="16,8 16.765,8.152 17.414,8.586 17.848,9.235 18,10 18,14 17.848,14.765 17.414,15.414 16.765,15.848 16,16 5,16 4.235,15.848 3.586,15.414 3.152,14.765 3,14 3,10 3.152,9.235 3.586,8.586 4.235,8.152 5,8" style="animation-delay:0.0s"/>
  <polyline class="a" pathLength="1" points="20.6,10.5 20.6,13.5" style="animation-delay:0.08s"/>
  <rect class="f" x="5.6" y="10.6" width="5.2" height="2.8" rx="0.6" style="animation-delay:0.16s"/>
  <circle class="d" cx="14" cy="12" r="1.1" style="animation-delay:0.24s,0.59s"/>
</svg>
