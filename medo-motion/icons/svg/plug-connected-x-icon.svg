<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Plug Connected X Icon" data-icon="plug-connected-x-icon">
  <title>Plug Connected X Icon</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.85s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 0.83s infinite ease-in-out}
  .f{fill:currentColor;stroke:none;animation:fadeIn .45s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <path class="a" pathLength="1" d="M20 16l-4 4" style="animation-delay:0.0s"/>
  <path class="a" pathLength="1" d="M7 12l5 5l-1.5 1.5a3.536 3.536 0 1 1 -5 -5l1.5 -1.5z" style="animation-delay:0.06s"/>
  <path class="a" pathLength="1" d="M17 12l-5 -5l1.5 -1.5a3.536 3.536 0 1 1 5 5l-1.5 1.5z" style="animation-delay:0.12s"/>
  <path class="a" pathLength="1" d="M3 21l2.5 -2.5" style="animation-delay:0.18s"/>
  <path class="a" pathLength="1" d="M18.5 5.5l2.5 -2.5" style="animation-delay:0.24s"/>
  <path class="a" pathLength="1" d="M10 11l-2 2" style="animation-delay:0.3s"/>
  <path class="a" pathLength="1" d="M13 14l-2 2" style="animation-delay:0.36s"/>
  <path class="a" pathLength="1" d="M16 16l4 4" style="animation-delay:0.42s"/>
</svg>
