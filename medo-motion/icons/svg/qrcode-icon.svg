<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="96" height="96" role="img" aria-label="Qrcode Icon" data-icon="qrcode-icon">
  <title>Qrcode Icon</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.85s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 0.83s infinite ease-in-out}
  .f{fill:currentColor;stroke:none;animation:fadeIn .45s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <polygon class="f" points="30,0 30,2 2,2 2,0" style="animation-delay:0.0s"/>
  <polygon class="a" pathLength="1" points="12,3 12,12 3,12 3,3" style="animation-delay:0.06s"/>
  <polygon class="a" pathLength="1" points="12,20 12,29 3,29 3,20" style="animation-delay:0.12s"/>
  <polygon class="a" pathLength="1" points="29,3 29,12 20,12 20,3" style="animation-delay:0.18s"/>
  <polygon class="a" pathLength="1" points="29,20 29,22 27,22 27,20" style="animation-delay:0.24s"/>
  <polygon class="a" pathLength="1" points="18,27 18,29 16,29 16,27" style="animation-delay:0.3s"/>
  <path class="a" pathLength="1" d="M3 16H7" style="animation-delay:0.36s"/>
  <path class="a" pathLength="1" d="M13 16H18M22 16V23H29M22 16H26M22 16H18M18 16V20H16" style="animation-delay:0.42s"/>
  <path class="a" pathLength="1" d="M16 7V10" style="animation-delay:0.48s"/>
  <path class="a" pathLength="1" d="M16 25V29H23V27" style="animation-delay:0.54s"/>
  <path class="a" pathLength="1" d="M29.01 29H29" style="animation-delay:0.6s"/>
  <polygon class="a" pathLength="1" points="25,7 25,8 24,8 24,7" style="animation-delay:0.66s"/>
  <polygon class="a" pathLength="1" points="8,7 8,8 7,8 7,7" style="animation-delay:0.72s"/>
  <polygon class="a" pathLength="1" points="8,24 8,25 7,25 7,24" style="animation-delay:0.78s"/>
</svg>
