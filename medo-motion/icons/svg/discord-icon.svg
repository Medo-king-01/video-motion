<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Discord Icon" data-icon="discord-icon">
  <title>Discord Icon</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.85s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 0.83s infinite ease-in-out}
  .f{fill:currentColor;stroke:none;animation:fadeIn .45s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <path class="a" pathLength="1" d="M8 12a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" style="animation-delay:0.0s"/>
  <path class="a" pathLength="1" d="M14 12a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" style="animation-delay:0.06s"/>
  <path class="a" pathLength="1" d="M7 16.5c3.5 1 6.5 1 10 0" style="animation-delay:0.12s"/>
  <path class="a" pathLength="1" d="M15.5 17c0 1 1.5 3 2 3c1.5 0 2.833 -1.667 3.5 -3c.667 -1.667 .5 -5.833 -1.5 -11.5c-1.457 -1.015 -3 -1.34 -4.5 -1.5l-.972 1.923a11.913 11.913 0 0 0 -4.053 0l-.975 -1.923c-1.5 .16 -3.043 .485 -4.5 1.5c-2 5.667 -2.167 9.833 -1.5 11.5c.667 1.333 2 3 3.5 3c.5 0 2 -2 2 -3" style="animation-delay:0.18s"/>
</svg>
