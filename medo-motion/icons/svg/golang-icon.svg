<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Golang Icon" data-icon="golang-icon">
  <title>Golang Icon</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.85s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 0.83s infinite ease-in-out}
  .f{fill:currentColor;stroke:none;animation:fadeIn .45s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <path class="a" pathLength="1" d="M15.695 14.305c1.061 1.06 2.953 .888 4.226 -.384c1.272 -1.273 1.444 -3.165 .384 -4.226c-1.061 -1.06 -2.953 -.888 -4.226 .384c-1.272 1.273 -1.444 3.165 -.384 4.226z" style="animation-delay:0.0s"/>
  <path class="a" pathLength="1" d="M12.68 9.233c-1.084 -.497 -2.545 -.191 -3.591 .846c-1.284 1.273 -1.457 3.165 -.388 4.226c1.07 1.06 2.978 .888 4.261 -.384a3.669 3.669 0 0 0 1.038 -1.921h-2.427" style="animation-delay:0.06s"/>
  <path class="a" pathLength="1" d="M5.5 15h-1.5" style="animation-delay:0.12s"/>
  <path class="a" pathLength="1" d="M6 9h-2" style="animation-delay:0.18s"/>
  <path class="a" pathLength="1" d="M5 12h-3" style="animation-delay:0.24s"/>
</svg>
