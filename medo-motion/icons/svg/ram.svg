  <polyline class="a" pathLength="1" points="10,17 10,20" style="animation-delay:0.3s"/>
  <polyline class="a" pathLength="1" points="14,17 14,20" style="animation-delay:0.36s"/>
  <polyline class="a" pathLength="1" points="18,17 18,20" style="animation-delay:0.42s"/>
  <circle class="d" cx="12" cy="12" r="1.4" style="animation-delay:0.48s,0.83s"/>
</svg>
