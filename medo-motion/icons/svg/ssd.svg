<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Storage — التخزين" data-icon="ssd">
  <title>Storage — التخزين</title>
<style>
  .a{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
     stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.9s cubic-bezier(.25,.9,.25,1) both}
  .d{fill:var(--icon-accent,currentColor);stroke:none;transform-box:fill-box;transform-origin:center;
     animation:dotIn .35s ease-out both,dotPulse 0.62s infinite ease-in-out}
  .f{fill:currentColor;stroke:none;animation:fadeIn .45s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes dotPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a{animation:none;stroke-dashoffset:0}.d,.f{animation:none}}
</style>
  <polygon class="a" pathLength="1" points="19,6 19.765,6.152 20.414,6.586 20.848,7.235 21,8 21,16 20.848,16.765 20.414,17.414 19.765,17.848 19,18 5,18 4.235,17.848 3.586,17.414 3.152,16.765 3,16 3,8 3.152,7.235 3.586,6.586 4.235,6.152 5,6" style="animation-delay:0.0s"/>
  <polyline class="a" pathLength="1" points="3,13 21,13" style="animation-delay:0.06s"/>
  <polyline class="a" pathLength="1" points="6,16 12,16" style="animation-delay:0.12s"/>
  <circle class="d" cx="16.5" cy="16" r="1.2" style="animation-delay:0.18s,0.53s"/>
  <circle class="d" cx="7" cy="9.5" r="1.1" style="animation-delay:0.24s,0.59s"/>
</svg>
