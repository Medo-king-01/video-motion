[project]
name = "medo-motion-studio"
version = "0.2.0"
description = "Arabic vertical-reel studio: locked brand, three render engines, agent-agnostic contract"
requires-python = ">=3.10"
readme = "README.md"

# Tooling config only — the studio is scripts, not an installable package.
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
  "tools/toolkit/node_modules",
  ".venv",
  "venv",
  "medo-motion/reference/source",
  ".git",
]

[tool.ruff.lint]
# E7 (one-statement-per-line, ambiguous names) is skipped on purpose: the render
# engines are dense graphics code written in a compact style. E4/E9/F catch the
# real bugs (bad imports, syntax, undefined names).
select = ["E4", "E9", "F", "I", "UP", "B"]
ignore = [
  "E501",   # long lines: the guides are prose, the engines are compact on purpose
  "B008",   # function calls in defaults are fine for small helpers
  "UP007",  # Optional[...] vs |: vendored code targets 3.9+
]

[tool.ruff.lint.per-file-ignores]
# The procedural engine intentionally uses `from lib import *` / `from art import *`
# (upstream design). Keeping it avoids a risky rewrite of 600 lines of scene code.
# Vendored helpers keep their original style (compact one-line imports); we only
# care about real bugs there, so F (unused/undefined names) stays enabled.
"medo-motion/scripts/*.py" = ["E401", "E402", "I", "UP", "B"]
"medo-motion/templates/procedural-reels/*.py" = ["E401", "E402", "F403", "F405", "I", "UP", "B"]
# shared/py is the editable copy of five of those files (byte-identical, tools/sync_shared_py.py).
"shared/py/*.py" = ["E401", "E402", "F403", "F405", "I", "UP", "B"]
"tools/ffprobe_shim.py" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: real synthesis/render/Chromium work — `-m 'not slow'` runs the quick loop (CI ignores the marker and runs every group)",
    "xdist_group: pin tests that share a Remotion bundler onto one worker (`-n` runs must not collide on a webpack bundle)",
]

[tool.coverage.run]
# The studio ships as scripts, not an installed package: measure what the tests import.
source = ["tools", "medo-motion/scripts", "medo-motion/templates/procedural-reels"]
omit = ["*/node_modules/*", "*/tests/*"]

[tool.coverage.report]
# Report only. No `fail_under`: the point of the first pass is to see the real gap.
skip_covered = true
skip_empty = true
show_missing = true
exclude_lines = ['pragma: no cover', 'if TYPE_CHECKING:', 'raise SystemExit(main())']
